name: PeleC-CI

on:
  workflow_dispatch:
  schedule:
    # Twice a week, so the ccaches are refreshed before GitHub evicts them
    # after 7 days without access, with a margin for late scheduled starts.
    # Jobs without a cache (CodeQL, codespell) skip the scheduled runs.
    - cron: '0 3 * * 1,4'
  push:
    branches: [development]
  pull_request:
    branches: [development]

concurrency:
  # Only PR runs cancel an older run: on development a cancelled run would
  # not save its caches, so runs (pushes and scheduled) queue, one at a time
  # (GitHub keeps only the newest pending one).
  group: ${{github.ref}}-${{github.head_ref}}-ci
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

# Run steps with bash -eo pipefail, so `build | tee log` fails with the build.
defaults:
  run:
    shell: bash

env:
  # Only development saves the ccaches (the scheduled runs keep them from
  # being evicted); PRs restore development's. A PR's own runs would each
  # store a full copy (~1.6 GB per PR) and push development's out of the
  # 10 GB limit.
  SAVE_CCACHE: ${{github.ref == 'refs/heads/development'}}
  # Compress hard only when the cache is kept; a PR's new entries are
  # discarded at the end of the job.
  CCACHE_COMPRESSLEVEL: ${{github.ref == 'refs/heads/development' && 10 || 1}}
  # The scheduled runs only refresh the ccaches: they build (which also
  # trims the caches to what is used) but skip the tests, which already
  # ran on this commit.
  RUN_TESTS: ${{github.event_name != 'schedule'}}
  # The ccache directory the cache steps save and restore (ccache's default
  # on Linux; CPU-CMake sets its own per OS).
  COMPILER_CACHE_DIR: ~/.cache/ccache

jobs:
  Detect-Changes:
    # A called workflow can only narrow the caller's token permissions, so
    # grant here what its filter job needs.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/detect-changes.yml

  Formatting:
    needs: Detect-Changes
    # Also on the scheduled runs (it takes seconds), so the build jobs that
    # need it run there to refresh their caches.
    if: needs['Detect-Changes'].outputs['has-source-changes'] == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Clone
      uses: actions/checkout@v6
    - name: Check formatting
      uses: DoozyX/clang-format-lint-action@v0.20
      with:
        source: './Source ./Exec'
        exclude: '.'
        extensions: 'H,h,cpp'
        clangFormatVersion: 20
  CPU-GNUmake:
    needs: [Detect-Changes, Formatting]
    if: needs['Detect-Changes'].outputs['has-source-changes'] == 'true'
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 500M
      CACHE_KEY: ccache-${{github.workflow}}-${{github.job}}
      # What the warning reports leave out, on top of count_warnings.sh's own.
      WARNINGS_EXCLUDE: GNUmakefile|ThirdParty
      # ccache for the CMake-built TPLs (SUNDIALS) too: CMake reads these as
      # the default compiler launchers.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Setup
        run: echo "NPROCS=$(nproc)" >> $GITHUB_ENV
      # Marks the start of the run for Trim Ccache and installs ccache: AMReX's
      # script on Linux (macOS gets it from brew in Dependencies), run outside
      # the checkout since it downloads into the current directory. Defined
      # once here and reused (*install_ccache) by the other jobs.
      - &install_ccache
        name: Install Ccache
        working-directory: ${{runner.temp}}
        run: |
          touch ${{runner.temp}}/ccache-start
          # Paths under the workspace are hashed relative to the compile's
          # directory, so a build directory's name (e.g. the reference
          # build's) does not stop it hitting another's entries. Set here as
          # the runner context is not available in env:.
          echo "CCACHE_BASEDIR=${{runner.workspace}}" >> $GITHUB_ENV
          if [ "${RUNNER_OS}" = Linux ]; then
            ${{github.workspace}}/Submodules/PelePhysics/Submodules/amrex/.github/workflows/dependencies/dependencies_ccache.sh
          fi
      # Restore only; the cache is saved at the end of the job, and only from
      # development (SAVE_CCACHE). Reused (*restore_ccache) by the other build
      # jobs, which each set CACHE_KEY.
      - &restore_ccache
        name: Set Up Ccache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{env.COMPILER_CACHE_DIR}}
          key: ${{env.CACHE_KEY}}-git-${{github.sha}}-${{github.run_id}}-${{github.run_attempt}}
          restore-keys: |
               ${{env.CACHE_KEY}}-git-
      - name: TPL
        working-directory: ./Exec/RegTests/PMF
        run: |
          make COMP=gnu USE_MPI=FALSE DEBUG=TRUE TPL
          make COMP=gnu USE_MPI=FALSE DEBUG=FALSE TPL
          make COMP=llvm USE_MPI=FALSE DEBUG=TRUE PRECISION=FLOAT TPL
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: PMF debug make
        working-directory: ./Exec/RegTests/PMF
        run: |
          ccache -z
          make -j ${{env.NPROCS}} KEEP_BUILDINFO_CPP=TRUE USE_CCACHE=TRUE COMP=gnu USE_MPI=FALSE DEBUG=TRUE USE_LCT_TRANSPORT=TRUE 2>&1 | tee -a build-output.txt
          ccache -s
      - name: PMF debug test
        if: env.RUN_TESTS == 'true'
        working-directory: ./Exec/RegTests/PMF
        run: ./PeleC3d.gnu.DEBUG.ex pmf-lidryer-arkode.inp max_step=2 amr.plot_files_output=0 amr.checkpoint_files_output=0
      - name: PMF multicomponent diffusion debug test
        if: env.RUN_TESTS == 'true'
        working-directory: ./Exec/RegTests/PMF
        run: ./PeleC3d.gnu.DEBUG.ex pmf-lidryer-multicomp.inp max_step=2 amr.plot_files_output=0 amr.checkpoint_files_output=0
      - name: PMF debug report
        working-directory: ./Exec/RegTests/PMF
        run: ${{github.workspace}}/.github/scripts/count_warnings.sh build-output.txt "${WARNINGS_EXCLUDE}"
      - name: EB debug build
        working-directory: ./Exec/RegTests/EB-C10
        run: |
          ccache -z
          make -j ${{env.NPROCS}} KEEP_BUILDINFO_CPP=TRUE USE_CCACHE=TRUE COMP=gnu USE_MPI=FALSE DEBUG=TRUE 2>&1 | tee -a build-output.txt
          ccache -s
      - name: EB debug test
        if: env.RUN_TESTS == 'true'
        working-directory: ./Exec/RegTests/EB-C10
        run: ./PeleC3d.gnu.DEBUG.ex eb-c10.inp max_step=2 amr.plot_files_output=0 amr.checkpoint_files_output=0
      - name: EB debug report
        working-directory: ./Exec/RegTests/EB-C10
        run: ${{github.workspace}}/.github/scripts/count_warnings.sh build-output.txt "${WARNINGS_EXCLUDE}"
      - name: EB OMP debug build
        working-directory: ./Exec/RegTests/EB-C10
        run: |
          ccache -z
          make -j ${{env.NPROCS}} KEEP_BUILDINFO_CPP=TRUE USE_CCACHE=TRUE COMP=gnu USE_MPI=FALSE DEBUG=TRUE USE_OMP=TRUE 2>&1 | tee -a build-output.txt
          ccache -s
      - name: EB OMP debug test
        if: env.RUN_TESTS == 'true'
        working-directory: ./Exec/RegTests/EB-C10
        run: ./PeleC3d.gnu.DEBUG.OMP.ex eb-c10.inp max_step=2 amr.plot_files_output=0 amr.checkpoint_files_output=0
      - name: EB OMP debug report
        working-directory: ./Exec/RegTests/EB-C10
        run: ${{github.workspace}}/.github/scripts/count_warnings.sh build-output.txt "${WARNINGS_EXCLUDE}"
      - name: TG debug single precision build
        working-directory: ./Exec/RegTests/TG
        run: |
          ccache -z
          make -j ${{env.NPROCS}} KEEP_BUILDINFO_CPP=TRUE USE_CCACHE=TRUE COMP=llvm USE_MPI=FALSE DEBUG=TRUE PRECISION=FLOAT 2>&1 | tee -a build-output.txt
          ccache -s
      - name: TG debug single precision test
        if: env.RUN_TESTS == 'true'
        working-directory: ./Exec/RegTests/TG
        run: ./PeleC3d.llvm.FLOAT.DEBUG.ex tg-2.inp max_step=2 amr.plot_files_output=0 amr.checkpoint_files_output=0
      - name: TG debug single precision report
        working-directory: ./Exec/RegTests/TG
        run: ${{github.workspace}}/.github/scripts/count_warnings.sh build-output.txt "${WARNINGS_EXCLUDE}"
      - name: Soot debug build
        working-directory: ./Exec/RegTests/Soot-Flame
        run: |
          ccache -z
          make -j ${{env.NPROCS}} KEEP_BUILDINFO_CPP=TRUE USE_CCACHE=TRUE COMP=gnu USE_MPI=FALSE DEBUG=TRUE 2>&1 | tee -a build-output.txt
          ccache -s
      - name: Soot debug report
        working-directory: ./Exec/RegTests/Soot-Flame
        run: ${{github.workspace}}/.github/scripts/count_warnings.sh build-output.txt "${WARNINGS_EXCLUDE}"
      - name: Spray debug build
        working-directory: ./Exec/RegTests/Spray-Conv
        run: |
          ccache -z
          make -j ${{env.NPROCS}} KEEP_BUILDINFO_CPP=TRUE USE_CCACHE=TRUE COMP=gnu USE_MPI=FALSE DEBUG=TRUE 2>&1 | tee -a build-output.txt
          ccache -s
      - name: Spray debug report
        working-directory: ./Exec/RegTests/Spray-Conv
        run: ${{github.workspace}}/.github/scripts/count_warnings.sh build-output.txt "${WARNINGS_EXCLUDE}"

      - name: TurbInflowGenerator build
        working-directory: ./Submodules/PelePhysics/Support/TurbInflowGenerator
        run: |
          ccache -z
          make -j ${{env.NPROCS}} KEEP_BUILDINFO_CPP=TRUE USE_CCACHE=TRUE COMP=gnu USE_MPI=FALSE 2>&1 | tee -a build-output.txt
          ccache -s
      - name: TurbInflowGenerator set up
        # Only the TurbInflow run below uses its output.
        if: env.RUN_TESTS == 'true'
        working-directory: ./Submodules/PelePhysics/Support/TurbInflowGenerator
        run: |
          python3 -m pip install --user scipy matplotlib numpy
          python3 gen_hit_ic.py -k0 4 -N 128 -Nk 128
          mv hit_ic_4_128.dat PeleTurb3d.gnu.ex ${{github.workspace}}/Exec/RegTests/EB-ConvergingNozzle
      - name: TurbInflowGenerator report
        working-directory: ./Submodules/PelePhysics/Support/TurbInflowGenerator
        run: ${{github.workspace}}/.github/scripts/count_warnings.sh build-output.txt "${WARNINGS_EXCLUDE}"
      - name: EB-ConvergingNozzle TurbInflow build
        working-directory: ./Exec/RegTests/EB-ConvergingNozzle
        run: |
          ccache -z
          make -j ${{env.NPROCS}} KEEP_BUILDINFO_CPP=TRUE USE_CCACHE=TRUE COMP=gnu USE_MPI=FALSE 2>&1 | tee -a build-output.txt
          ccache -s
      - name: EB-ConvergingNozzle TurbInflow run
        if: env.RUN_TESTS == 'true'
        working-directory: ./Exec/RegTests/EB-ConvergingNozzle
        run: |
          # Create and run with synthetic turbulent fluctuation inflow
          ./PeleTurb3d.gnu.ex type=turb_box hit_file=hit_ic_4_128.dat input_ncell=128 ofile=HIT
          ./PeleC3d.gnu.ex turb_inflow_base.inp FILE=run_with_hit.inp
          # Run precursor simulation, compile planes to inflow, run main simulation with inflow
          ./PeleC3d.gnu.ex turb_inflow_base.inp FILE=run_initial_dump_planes.inp
          ./PeleTurb3d.gnu.ex type=diag_frame_planes ofile=INFLOW ifiles= $(ls -d output_initial/pltxcut*[0-9]) periodicity=0 0 0 normal=0
          ./PeleC3d.gnu.ex turb_inflow_base.inp FILE=run_with_inflow.inp
      - name: EB-ConvergingNozzle TurbInflow debug report
        working-directory: ./Exec/RegTests/EB-ConvergingNozzle
        run: ${{github.workspace}}/.github/scripts/count_warnings.sh build-output.txt "${WARNINGS_EXCLUDE}"
      # Drop the entries this run did not use (hits refresh an entry's mtime),
      # so the saved cache is the current working set; only after a successful
      # job (the default condition), since a failed one never reached some
      # files. Reused (*trim_ccache, *save_ccache) by the other build jobs.
      # COMPILER_CACHE_DIR and CACHE_KEY are not CCACHE_* names on purpose:
      # ccache reads those (CCACHE_PATH is where it looks for the compiler).
      - &trim_ccache
        name: Trim Ccache
        if: env.SAVE_CCACHE == 'true'
        run: |
          # A plain assignment, so a missing marker fails the step (bash -e)
          # rather than silently trimming nothing.
          start=$(date -r ${{runner.temp}}/ccache-start +%s)
          ccache --evict-older-than $(( $(date +%s) - start + 60 ))s
          ccache -s
      - &save_ccache
        name: Save Ccache
        if: env.SAVE_CCACHE == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{env.COMPILER_CACHE_DIR}}
          key: ${{steps.ccache.outputs.cache-primary-key}}
  CPU-CMake:
    needs: [Detect-Changes, Formatting]
    if: needs['Detect-Changes'].outputs['has-source-changes'] == 'true'
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        build_type: [Release, Debug]
        dim: [2, 3]
        include:
          - os: macos-latest
            install_deps: brew install open-mpi libtool automake ccache
            procs: $(sysctl -n hw.ncpu)
            ccache_cache: /Users/runner/Library/Caches/ccache
            reference_comparison: ON
          - os: ubuntu-24.04
            install_deps: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin libtool-bin
            procs: $(nproc)
            ccache_cache: ~/.cache/ccache
            reference_comparison: OFF
          - build_type: Release
            ctest_args: -LE no-ci
            ccache_size: 250M
          - build_type: Debug
            ctest_args: -R eb-c12
            ccache_size: 500M
        exclude:
          - os: macos-latest
            build_type: Debug
    env:
      # Compare with development, except on development itself.
      DO_REF_COMPARE: ${{matrix.reference_comparison == 'ON' && github.ref != 'refs/heads/development'}}
      CCACHE_MAXSIZE: ${{matrix.ccache_size}}
      COMPILER_CACHE_DIR: ${{matrix.ccache_cache}}
      CACHE_KEY: ccache-${{github.workflow}}-${{github.job}}-${{matrix.os}}-${{matrix.dim}}-${{matrix.build_type}}
      CTEST_ARGS: ${{matrix.ctest_args}}
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      # Before setup-python: the script deletes the hosted tool cache.
      - name: Free Disk Space
        if: runner.os == 'Linux'
        run: ${{github.workspace}}/Submodules/PelePhysics/Submodules/amrex/.github/workflows/dependencies/ubuntu_free_disk_space.sh
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Setup
        run: |
          echo "NPROCS=${{matrix.procs}}" >> $GITHUB_ENV
      - name: Dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          # Install MPI
          ${{matrix.install_deps}}
      - name: Python packages
        # Only the tests use them.
        if: env.RUN_TESTS == 'true'
        run: pip install pynose numpy pandas setuptools
      - *install_ccache
      - *restore_ccache
      - name: MASA
        run: |
          DEPS=${{runner.workspace}}/deps
          mkdir -p ${DEPS}
          # Install MetaPhysicL
          cd ${DEPS}
          git clone --recursive https://github.com/roystgnr/MetaPhysicL.git
          cd MetaPhysicL
          ./bootstrap
          ./configure --prefix="${DEPS}/install/MetaPhysicL"
          make -j ${{env.NPROCS}}
          make install
          # Install MASA
          cd ${DEPS}
          git clone --recursive https://github.com/manufactured-solutions/MASA.git
          cd MASA
          ./bootstrap
          ./configure CXX='mpicxx -std=c++11' CC=mpicc \
            METAPHYSICL_DIR="${DEPS}/install/MetaPhysicL" \
            --prefix="${DEPS}/install/MASA"
          make -j ${{env.NPROCS}}
          make install
      - name: Configure
        run: |
          cmake -B${{runner.workspace}}/build \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/install \
          -DCMAKE_BUILD_TYPE:STRING=${{matrix.build_type}} \
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
          -DPELE_DIM:STRING=${{matrix.dim}} \
          -DPELE_ENABLE_MPI:BOOL=ON \
          -DMPIEXEC_PREFLAGS:STRING=--oversubscribe \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=OFF \
          -DPELE_ENABLE_MASA:BOOL=ON \
          -DPELE_SAVE_GOLDS:BOOL=${{matrix.reference_comparison}} \
          -DPELE_SAVED_GOLDS_DIRECTORY=${{runner.workspace}}/build \
          -DPELE_EXCLUDE_BUILD_IN_CI:BOOL=ON \
          -DMASA_ROOT:PATH=${{runner.workspace}}/deps/install/MASA \
          -DCMAKE_C_COMPILER_LAUNCHER:STRING=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER:STRING=ccache \
          ${{github.workspace}}
      - name: Build
        run: |
          ccache -z
          cmake --build ${{runner.workspace}}/build \
            --parallel ${{env.NPROCS}} 2>&1 | tee -a ${{runner.workspace}}/build-output.txt
          ccache -s
      - name: Report
        run: .github/scripts/count_warnings.sh ${{runner.workspace}}/build-output.txt
      - name: Test
        if: env.RUN_TESTS == 'true'
        working-directory: ${{runner.workspace}}/build
        run: ctest ${CTEST_ARGS} -VV --output-on-failure
      - name: Checkout Reference Version
        if: env.DO_REF_COMPARE == 'true'
        run: |
          # Development is checked out over this work tree, so the reference
          # build sits next to it exactly as development's own build does and,
          # with CCACHE_BASEDIR, hits development's cache entries. Keep the
          # target helper, which development may not have.
          cp ${{github.workspace}}/.github/scripts/ctest_targets.py ${{runner.temp}}/
          git fetch --depth=1 https://github.com/Pele-Suite/PeleC.git development
          git checkout FETCH_HEAD
          git submodule update --recursive --depth=1
      - name: Configure Reference Version
        if: env.DO_REF_COMPARE == 'true'
        run: |
          # CMake File API query: the configure writes the codemodel that
          # ctest_targets.py reads to map test commands to targets.
          QUERY=${{runner.workspace}}/build-reference/.cmake/api/v1/query
          mkdir -p ${QUERY}
          touch ${QUERY}/codemodel-v2
          cmake -B${{runner.workspace}}/build-reference \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/install-reference  \
          -DCMAKE_BUILD_TYPE:STRING=${{matrix.build_type}} \
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
          -DPELE_DIM:STRING=${{matrix.dim}} \
          -DPELE_ENABLE_MPI:BOOL=ON \
          -DMPIEXEC_PREFLAGS:STRING=--oversubscribe \
          -DPELE_ENABLE_FCOMPARE:BOOL=ON \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=ON \
          -DPELE_REFERENCE_GOLDS_DIRECTORY:STRING=${{runner.workspace}}/build \
          -DPELE_ENABLE_MASA:BOOL=ON \
          -DPELE_EXCLUDE_BUILD_IN_CI:BOOL=ON \
          -DPELE_SKIP_NON_FCOMPARE_TESTS:BOOL=ON \
          -DMASA_ROOT:PATH=${{runner.workspace}}/deps/install/MASA \
          -DCMAKE_C_COMPILER_LAUNCHER:STRING=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER:STRING=ccache \
          ${{github.workspace}}
      - name: Build Reference Version
        if: env.DO_REF_COMPARE == 'true'
        run: |
          ccache -z
          # The reference build only produces plotfiles for the comparison:
          # build just the executables its tests run.
          BUILD_DIR=${{runner.workspace}}/build-reference
          TARGETS=$(python3 ${{runner.temp}}/ctest_targets.py ${BUILD_DIR} ${CTEST_ARGS}) \
            || { echo "::warning::could not list the test targets, building all"; TARGETS=""; }
          echo "Building: ${TARGETS:-all targets}"
          cmake --build ${BUILD_DIR} --parallel ${{env.NPROCS}} ${TARGETS:+--target ${TARGETS}}
          ccache -s
      - name: Test Reference and Compare
        if: env.DO_REF_COMPARE == 'true'
        working-directory: ${{runner.workspace}}/build-reference
        run: ctest ${CTEST_ARGS} -VV --output-on-failure
      - *trim_ccache
      - *save_ccache

  CPU-CMake-SINGLE:
    needs: [Detect-Changes, Formatting]
    if: needs['Detect-Changes'].outputs['has-source-changes'] == 'true'
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 250M
      CACHE_KEY: ccache-${{github.workflow}}-${{github.job}}-${{matrix.dim}}-single
    strategy:
      fail-fast: false
      matrix:
        dim: [2, 3]
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Dependencies
        run: |
          # Install MPI
          sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Setup
        run: |
          echo "NPROCS=$(nproc)" >> $GITHUB_ENV
      - *install_ccache
      - *restore_ccache
      - name: Configure
        run: |
          cmake -B${{runner.workspace}}/build-${{matrix.dim}}d-single \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/install-${{matrix.dim}}d-single \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
          -DPELE_DIM:STRING=${{matrix.dim}} \
          -DPELE_PRECISION:STRING=SINGLE \
          -DCMAKE_CXX_FLAGS:STRING=-Wno-float-conversion \
          -DPELE_ENABLE_MPI:BOOL=ON \
          -DMPIEXEC_PREFLAGS:STRING=--oversubscribe \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=OFF \
          -DPELE_ENABLE_MASA:BOOL=OFF \
          -DPELE_EXCLUDE_BUILD_IN_CI:BOOL=ON \
          -DCMAKE_C_COMPILER_LAUNCHER:STRING=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER:STRING=ccache \
          ${{github.workspace}}
      - name: Build
        run: |
          ccache -z
          cmake --build ${{runner.workspace}}/build-${{matrix.dim}}d-single \
            --parallel ${{env.NPROCS}} 2>&1 | tee -a ${{runner.workspace}}/build-output.txt
          ccache -s
      - name: Report
        run: .github/scripts/count_warnings.sh ${{runner.workspace}}/build-output.txt
      - *trim_ccache
      - *save_ccache

  GPU-Nvidia:
    name: GPU-CUDA
    needs: [Detect-Changes, Formatting, CPU-GNUmake]
    if: needs['Detect-Changes'].outputs['has-source-changes'] == 'true'
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 300M
      CACHE_KEY: ccache-${{github.workflow}}-${{github.job}}
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Setup
        run: |
          echo "NPROCS=$(nproc)" >> $GITHUB_ENV
      - name: Dependencies
        run: |
          ${{github.workspace}}/Submodules/PelePhysics/Submodules/amrex/.github/workflows/dependencies/ubuntu_free_disk_space.sh
          ${{github.workspace}}/Submodules/PelePhysics/.github/workflows/dependencies/dependencies_cuda.sh
      - *install_ccache
      - *restore_ccache
      - name: Configure
        run: |
          # /usr/local/cuda points at whichever version dependencies_cuda.sh installed.
          export PATH=/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}
          export LD_LIBRARY_PATH=/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64:${LD_LIBRARY_PATH}
          cmake -Bbuild-cuda \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
            -DPELE_ENABLE_MPI:BOOL=OFF \
            -DPELE_ENABLE_CUDA:BOOL=ON \
            -DPELE_EXCLUDE_BUILD_IN_CI:BOOL=ON \
            -DAMReX_CUDA_ERROR_CAPTURE_THIS:BOOL=ON \
            -DCMAKE_CUDA_ARCHITECTURES:STRING=80 \
            -DCMAKE_CUDA_COMPILER_LAUNCHER:STRING=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER:STRING=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER:STRING=ccache \
            ${{github.workspace}}
      - name: Build
        run: |
          ccache -z
          cmake --build build-cuda --parallel ${{env.NPROCS}}
          ccache -s
      - *trim_ccache
      - *save_ccache
  GPU-AMD:
    name: GPU-HIP
    needs: [Detect-Changes, Formatting, CPU-GNUmake]
    if: needs['Detect-Changes'].outputs['has-source-changes'] == 'true'
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 250M
      CACHE_KEY: ccache-${{github.workflow}}-${{github.job}}
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Setup
        run: |
          echo "NPROCS=$(nproc)" >> $GITHUB_ENV
      - name: Dependencies
        run: |
          ${{github.workspace}}/Submodules/PelePhysics/Submodules/amrex/.github/workflows/dependencies/ubuntu_free_disk_space.sh
          sudo mkdir --parents --mode=0755 /etc/apt/keyrings
          wget https://repo.radeon.com/rocm/rocm.gpg.key -O - | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.3.3 noble main" | sudo tee --append /etc/apt/sources.list.d/rocm.list
          echo -e 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600' | sudo tee /etc/apt/preferences.d/rocm-pin-600
          echo 'export PATH=/opt/rocm/llvm/bin:/opt/rocm/bin:/opt/rocm/profiler/bin:/opt/rocm/opencl/bin:$PATH' | sudo tee -a /etc/profile.d/rocm.sh
          sudo apt-get update
          sudo apt-get install -y rocm-dev rocrand-dev rocprim-dev hiprand-dev
      - *install_ccache
      - *restore_ccache
      - name: Configure
        run: |
          source /etc/profile.d/rocm.sh
          hipcc --version
          cmake -B${{runner.workspace}}/build-hip \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
          -DCMAKE_CXX_COMPILER:STRING=$(which clang++) \
          -DCMAKE_C_COMPILER:STRING=$(which clang) \
          -DPELE_ENABLE_MPI:BOOL=OFF \
          -DPELE_ENABLE_HIP:BOOL=ON \
          -DPELE_EXCLUDE_BUILD_IN_CI:BOOL=ON \
          -DAMReX_AMD_ARCH:STRING=gfx90a \
          -DCMAKE_HIP_ARCHITECTURES:STRING=gfx90a \
          -DAMDGPU_TARGETS:STRING=gfx90a \
          -DGPU_TARGETS:STRING=gfx90a \
          -DAMReX_GPU_RDC:BOOL=OFF \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=OFF \
          -DPELE_ENABLE_MASA:BOOL=OFF \
          -DCMAKE_C_COMPILER_LAUNCHER:STRING=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER:STRING=ccache \
          ${{github.workspace}}
      - name: Build
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          source /etc/profile.d/rocm.sh
          ccache -z
          cmake --build ${{runner.workspace}}/build-hip --parallel ${{env.NPROCS}}
          ccache -s
      - *trim_ccache
      - *save_ccache
  GPU-Intel:
    name: GPU-SYCL
    needs: [Detect-Changes, Formatting, CPU-GNUmake]
    if: needs['Detect-Changes'].outputs['has-source-changes'] == 'true'
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 200M
      CACHE_KEY: ccache-${{github.workflow}}-${{github.job}}
      CCACHE_DEPEND: 1
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Setup
        run: |
          echo "NPROCS=$(nproc)" >> $GITHUB_ENV
      - name: Dependencies
        run: |
          ${{github.workspace}}/Submodules/PelePhysics/Submodules/amrex/.github/workflows/dependencies/ubuntu_free_disk_space.sh
          sudo wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          sudo apt-key add GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          echo "deb https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel
      - *install_ccache
      - *restore_ccache
      - name: Configure
        run: |
          # setvars.sh returns nonzero under errexit; || suspends errexit.
          source /opt/intel/oneapi/setvars.sh || true
          cmake -B${{runner.workspace}}/build-sycl \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
            -DCMAKE_CXX_COMPILER:STRING=$(which icpx) \
            -DCMAKE_C_COMPILER:STRING=$(which icx) \
            -DCMAKE_CXX_FLAGS:STRING=-fsycl \
            -DPELE_ENABLE_MPI:BOOL=OFF \
            -DPELE_ENABLE_MASA:BOOL=OFF \
            -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=OFF \
            -DPELE_ENABLE_SYCL:BOOL=ON \
            -DPELE_EXCLUDE_BUILD_IN_CI:BOOL=ON \
            -DCMAKE_C_COMPILER_LAUNCHER:STRING=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER:STRING=ccache \
            ${{github.workspace}}
      - name: Build
        run: |
          # setvars.sh returns nonzero under errexit; || suspends errexit.
          source /opt/intel/oneapi/setvars.sh || true
          ccache -z
          cmake --build ${{runner.workspace}}/build-sycl --parallel ${{env.NPROCS}}
          ccache -s
      - *trim_ccache
      - *save_ccache
  Lint-clang-tidy:
    needs: [Detect-Changes, Formatting]
    if: needs['Detect-Changes'].outputs['has-source-changes'] == 'true'
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 100M
      # Unlike the build jobs, this cache is saved on PRs too: a cold
      # clang-tidy run takes hours, and the cache is small.
      CCACHE_COMPRESSLEVEL: 10
      # clang-tidy-cache skips files whose preprocessed source, flags and
      # resolved clang-tidy config are unchanged. SAVE_OUTPUT/SAVE_ALL store
      # each file's diagnostics (clang-tidy's stdout) and exit code and replay
      # them on a hit; stderr is not replayed. Comments are kept in the hash
      # so that NOLINT edits invalidate the entry.
      CTCACHE_SAVE_OUTPUT: 1
      CTCACHE_SAVE_ALL: 1
      CTCACHE_KEEP_COMMENTS: 1
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Setup
        run: |
          echo "NPROCS=$(nproc)" >> $GITHUB_ENV
          # Keyed on the clang-tidy version, which the ctcache hash does not include
          echo "CTCACHE_DIR=${HOME}/.cache/ctcache/$(clang-tidy --version | sha256sum | cut -c1-12)" >> $GITHUB_ENV
      - *install_ccache
      - name: Install ctcache
        run: |
          # ctcache 1.2.0; the module is a self-contained script
          sudo curl -fsSL https://raw.githubusercontent.com/matus-chochlik/ctcache/e33c063ca6e52b48bcefbc45d46d8c150ffa81ca/src/ctcache/clang_tidy_cache.py -o /usr/local/bin/clang-tidy-cache
          sudo chmod +x /usr/local/bin/clang-tidy-cache
      # Restore and save separately: the combined actions/cache saves only
      # when the whole job passes, so a run that finds warnings would throw
      # away the cache it just filled.
      - name: Set Up Ccache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/ctcache
          key: ccache-${{github.workflow}}-${{github.job}}-git-${{github.sha}}-${{github.run_id}}-${{github.run_attempt}}
          restore-keys: |
               ccache-${{github.workflow}}-${{github.job}}-git-
      - name: Configure
        # Same workaround as PelePhysics' downstream clang-tidy jobs: clang 18's
        # optimizer crashes on AMReX_EB_STL_utils.cpp (-O3 with
        # -ffp-exception-behavior=maytrap); -O0 sidesteps it while Release keeps
        # NDEBUG. This job only compiles for the analysis.
        run: |
          cmake -B${{runner.workspace}}/build-clang-tidy \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DCMAKE_C_FLAGS_RELEASE:STRING="-O0 -DNDEBUG" \
          -DCMAKE_CXX_FLAGS_RELEASE:STRING="-O0 -DNDEBUG" \
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
          -DCMAKE_CXX_COMPILER:STRING=clang++ \
          -DCMAKE_C_COMPILER:STRING=clang \
          -DPELE_ENABLE_MPI:BOOL=OFF \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=OFF \
          -DPELE_ENABLE_MASA:BOOL=OFF \
          -DPELE_ENABLE_CLANG_TIDY:BOOL=ON \
          "-DCLANG_TIDY_EXE:STRING=clang-tidy-cache;$(command -v clang-tidy)" \
          -DPELE_EXCLUDE_BUILD_IN_CI:BOOL=ON \
          -DCMAKE_C_COMPILER_LAUNCHER:STRING=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER:STRING=ccache \
          ${{github.workspace}}
      - name: Check
        id: check
        working-directory: ${{runner.workspace}}/build-clang-tidy
        run: |
          mkdir -p ${CTCACHE_DIR}
          touch ${{runner.temp}}/ctcache-start
          build_status=0
          cmake --build . --parallel ${{env.NPROCS}} 2>&1 | tee -a clang-tidy-full-report.txt || build_status=$?
          # Hits refresh an entry's mtime: drop the ones this run did not use
          # (and older clang-tidy versions) so the cache does not grow. Only
          # after a complete build: a failed one never reached some files.
          if [ ${build_status} -eq 0 ]; then
            find ${CTCACHE_DIR} -type f ! -newer ${{runner.temp}}/ctcache-start -delete
            find ${HOME}/.cache/ctcache -mindepth 1 -maxdepth 1 ! -path ${CTCACHE_DIR} -exec rm -rf {} +
          fi
          # Fail on a failed build: a replayed cache hit restores the exit
          # code but not clang-tidy's stderr, so the warning count alone can
          # miss it.
          exit ${build_status}
      - name: Ccache Report
        run: |
          du -hs ~/.cache/ccache
          du -hs ~/.cache/ctcache
          # Entries are named by the rest of their sha1 digest (38 hex
          # characters); the per-directory stats files are not counted.
          echo "ctcache entries: $(find ${CTCACHE_DIR} -type f -regextype posix-extended -regex '.*/[0-9a-f]{38}' | wc -l)"
          ccache -s
      # Saved on PRs too (see CCACHE_COMPRESSLEVEL above), whenever Check
      # completed the build, before Short report can fail on warnings.
      - name: Save Ccache
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/ctcache
          key: ${{steps.ccache.outputs.cache-primary-key}}
      # Report on a failed Check too: that is when the warnings matter. The
      # full log is in the Check step.
      - name: Short report
        if: success() || steps.check.outcome == 'failure'
        working-directory: ${{runner.workspace}}/build-clang-tidy
        run: ${{github.workspace}}/.github/scripts/count_warnings.sh clang-tidy-full-report.txt
  Lint-codeql:
    needs: [Detect-Changes, Formatting]
    if: needs['Detect-Changes'].outputs['run-checks'] == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          queries: +security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      - name: Configure
        run: |
          echo "NPROCS=$(nproc)" >> $GITHUB_ENV
          cmake -B${{runner.workspace}}/build-codeql \
          -DCMAKE_BUILD_TYPE:STRING=Debug \
          -DCMAKE_CXX_COMPILER:STRING=clang++ \
          -DCMAKE_C_COMPILER:STRING=clang \
          -DPELE_ENABLE_MPI:BOOL=OFF \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=OFF \
          -DPELE_ENABLE_MASA:BOOL=OFF \
          -DPELE_EXCLUDE_BUILD_IN_CI:BOOL=ON \
          -DPELE_ENABLE_CLANG_TIDY:BOOL=OFF \
          ${{github.workspace}}
      - name: Build
        run: cmake --build ${{runner.workspace}}/build-codeql --parallel ${{env.NPROCS}}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp"
          upload: False
          output: sarif-results
      - name: Filter CodeQL sarif
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            -**/Submodules/sundials/**
            -**/Submodules/amrex/**
          input: sarif-results/cpp.sarif
          output: sarif-results/cpp.sarif
      - name: Upload CodeQL sarif
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results/cpp.sarif
  Lint-codespell:
    # Not filtered: docs-only changes are what it checks. No cache to
    # refresh, so skipped on the scheduled runs.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v6
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install codespell
      - name: Run codespell
        run: codespell

  # The one check for branch protection to require. A job skipped by its own
  # `if:` (docs-only changes) does not expand its matrix, so the per-entry
  # checks such as "CPU-CMake (ubuntu-24.04, ...)" never report and a PR
  # requiring them waits forever; skipped jobs pass here. It also fails when
  # Detect-Changes fails, which would otherwise skip every build.
  # CPU-CMake-SINGLE is left out, as it is not a required check.
  CI-Status:
    needs: [Detect-Changes, Formatting, CPU-GNUmake, CPU-CMake, GPU-Nvidia,
            GPU-AMD, GPU-Intel, Lint-clang-tidy, Lint-codeql, Lint-codespell]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "${RESULTS}"
          for r in ${RESULTS}; do
            [ "$r" = success ] || [ "$r" = skipped ] || exit 1
          done
