        run : |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          set -eu -o pipefail
          ccache -z
          make -j ${{env.NPROCS}} KEEP_BUILDINFO_CPP=TRUE USE_CCACHE=TRUE COMP=gnu USE_MPI=FALSE 2>&1 | tee -a build-output.txt
      - name: EB-ConvergingNozzle TurbInflow  ccache report
        working-directory: ./Exec/RegTests/EB-ConvergingNozzle
        run: |
          ccache -s
          du -hs ~/.cache/ccache
      - name: EB-ConvergingNozzle TurbInflow run
        working-directory: ./Exec/RegTests/EB-ConvergingNozzle
        run: |
          # Create and run with synthetic turbulent fluctuation inflow
          ./PeleTurb3d.gnu.ex type=turb_box hit_file=hit_ic_4_128.dat input_ncell=128 ofile=HIT
          ./PeleC3d.gnu.ex turb_inflow_base.inp FILE=run_with_hit.inp
          # Run precursor simulation, compile planes to inflow, run main simulation with inflow
          ./PeleC3d.gnu.ex turb_inflow_base.inp FILE=run_initial_dump_planes.inp
          ./PeleTurb3d.gnu.ex type=diag_frame_planes ofile=INFLOW ifiles= $(ls -d output_initial/pltxcut*[0-9]) periodicity=0 0 0 normal=0
          ./PeleC3d.gnu.ex turb_inflow_base.inp FILE=run_with_inflow.inp
      - name: EB-ConvergingNozzle TurbInflow debug report
        working-directory: ./Exec/RegTests/EB-ConvergingNozzle
        run: |
          egrep "Warning:|Error:|warning:|error:" build-output.txt \
            | egrep -v "Submodules/amrex|Submodules/sundials|GNUmakefile|ThirdParty" \
            | egrep -v "ld: warning:" | sort | uniq \
            | awk 'BEGIN{i=0}{print $0}{i++}END{print "Warnings: "i}' > warnings.txt
          cat warnings.txt
          export return=$(tail -n 1 warnings.txt | awk '{print $2}')
          exit ${return}
  CPU-CMake:
    needs: Formatting
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        build_type: [Release, Debug]
        dim: [2, 3]
        include:
          - os: macos-latest
            install_deps: brew install open-mpi libtool automake ccache
            comp: llvm
            procs: $(sysctl -n hw.ncpu)
            ccache_cache: /Users/runner/Library/Caches/ccache
            reference_comparison: ON
          - os: ubuntu-24.04
            install_deps: sudo apt-get install -y libopenmpi-dev openmpi-bin libtool-bin
            comp: gnu
            procs: $(nproc)
            ccache_cache: ~/.cache/ccache
            reference_comparison: OFF
          - build_type: Release
            ctest_args: -LE no-ci
            ccache_size: 250M
          - build_type: Debug
            ctest_args: -R eb-c12
            ccache_size: 500M
        exclude:
          - os: macos-latest
            build_type: Debug
    env:
      DO_REF_COMPARE: ${{matrix.reference_comparison == 'ON' && github.event_name != 'push'}}
    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup
        run: |
          echo "NPROCS=${{matrix.procs}}" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_COMPRESSLEVEL=10" >> $GITHUB_ENV
          echo "CCACHE_LOGFILE=${{github.workspace}}/ccache.log.txt" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=${{matrix.ccache_size}}" >> $GITHUB_ENV
          cmake -E make_directory ${{runner.workspace}}/deps
          if [ "${RUNNER_OS}" != "macOS" ]; then
            ${{github.workspace}}/Submodules/PelePhysics/Submodules/amrex/.github/workflows/dependencies/ubuntu_free_disk_space.sh
          fi
      - name: Dependencies
        run: |
          # Install MPI
          ${{matrix.install_deps}}
          # Install Python packages
          python -m pip install --upgrade pip
          pip install pynose numpy pandas setuptools
      - name: Install Ccache
        run: |
          if [ "${RUNNER_OS}" != "macOS" ]; then
            wget https://github.com/ccache/ccache/releases/download/v4.8/ccache-4.8-linux-x86_64.tar.xz
            tar xvf ccache-4.8-linux-x86_64.tar.xz
            sudo cp -f ccache-4.8-linux-x86_64/ccache /usr/local/bin/
          fi
      - name: Set Up Ccache
        uses: actions/cache@v4
        with:
          path: ${{matrix.ccache_cache}}
          key: ccache-${{github.workflow}}-${{github.job}}-${{matrix.os}}-${{matrix.dim}}-${{matrix.build_type}}-git-${{github.sha}}
          restore-keys: |
               ccache-${{github.workflow}}-${{github.job}}-${{matrix.os}}-${{matrix.dim}}-${{matrix.build_type}}-git-
      - name: MASA
        run: |
          # Install MetaPhysicL
          cd ${{runner.workspace}}/deps
          git clone --recursive https://github.com/roystgnr/MetaPhysicL.git ${{runner.workspace}}/deps/MetaPhysicL
          cd ${{runner.workspace}}/deps/MetaPhysicL
          ./bootstrap
          ./configure --prefix="${{runner.workspace}}/deps/install/MetaPhysicL"
          make -j ${{env.NPROCS}}
          make install
          # Install MASA
          cd ${{runner.workspace}}/deps
          git clone --recursive https://github.com/manufactured-solutions/MASA.git ${{runner.workspace}}/deps/MASA
          cd ${{runner.workspace}}/deps/MASA
          ./bootstrap
          ./configure CXX='mpicxx -std=c++11' CC=mpicc \
            METAPHYSICL_DIR="${{runner.workspace}}/deps/install/MetaPhysicL" \
            --prefix="${{runner.workspace}}/deps/install/MASA"
          make -j ${{env.NPROCS}}
          make install
      - name: Configure
        run: |
          cmake -B${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}} \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/install-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}} \
          -DCMAKE_BUILD_TYPE:STRING=${{matrix.build_type}} \
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
          -DPELE_DIM:STRING=${{matrix.dim}} \
          -DPELE_ENABLE_MPI:BOOL=ON \
          -DMPIEXEC_PREFLAGS:STRING=--oversubscribe \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=OFF \
          -DPELE_ENABLE_MASA:BOOL=ON \
          -DPELE_SAVE_GOLDS:BOOL=${{matrix.reference_comparison}} \
          -DPELE_SAVED_GOLDS_DIRECTORY=${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}} \
          -DPELE_EXCLUDE_BUILD_IN_CI:BOOL=ON \
          -DMASA_ROOT:PATH=${{runner.workspace}}/deps/install/MASA \
          -DCMAKE_CXX_COMPILER_LAUNCHER:STRING=ccache \
          ${{github.workspace}}
      - name: Build
        run: |
          ccache -z
            cmake --build ${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}} \
            --parallel ${{env.NPROCS}} 2>&1 | tee -a ${{runner.workspace}}/build-output.txt; \
          if [ ${PIPESTATUS[0]} -ne 0 ]; then exit 1; fi \
      - name: Ccache Report
        run: |
          ccache -s
          du -hs ${{matrix.ccache_cache}}
      - name: Report
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          egrep "Warning:|Error:|warning:|error:" ${{runner.workspace}}/build-output.txt \
            | egrep -v "Submodules/amrex|Submodules/sundials" \
            | egrep -v "ld: warning:" | egrep -v "lto-wrapper: warning:" | sort | uniq \
            | awk 'BEGIN{i=0}{print $0}{i++}END{print "Warnings: "i}' > ${{runner.workspace}}/build-output-warnings.txt
          cat ${{runner.workspace}}/build-output-warnings.txt
          export return=$(tail -n 1 ${{runner.workspace}}/build-output-warnings.txt | awk '{print $2}')
          exit ${return}
      - name: Test
        working-directory: ${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}
        run: |
          ctest ${{matrix.ctest_args}} -VV --output-on-failure
      - name: Checkout Reference Version
        if: env.DO_REF_COMPARE == 'true'
        run : |
          git remote add amrexcomb https://github.com/AMReX-Combustion/PeleC.git
          git fetch amrexcomb development --depth=1
          git checkout amrexcomb/development
          git submodule update --recursive --depth=1
      - name: Configure Reference Version
        if: env.DO_REF_COMPARE == 'true'
        run : |
          cmake -B${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-reference \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/install-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-reference  \
          -DCMAKE_BUILD_TYPE:STRING=${{matrix.build_type}} \
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
          -DPELE_DIM:STRING=${{matrix.dim}} \
          -DPELE_ENABLE_MPI:BOOL=ON \
          -DMPIEXEC_PREFLAGS:STRING=--oversubscribe \
          -DPELE_ENABLE_FCOMPARE:BOOL=ON \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=ON \
          -DPELE_REFERENCE_GOLDS_DIRECTORY:STRING=${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}} \
          -DPELE_ENABLE_MASA:BOOL=ON \
          -DPELE_EXCLUDE_BUILD_IN_CI:BOOL=ON \
          -DPELE_SKIP_NON_FCOMPARE_TESTS:BOOL=ON \
          -DMASA_ROOT:PATH=${{runner.workspace}}/deps/install/MASA \
          -DCMAKE_CXX_COMPILER_LAUNCHER:STRING=ccache \
          ${{github.workspace}}
      - name: Build Reference Version
        if: env.DO_REF_COMPARE == 'true'
        run : |
          ccache -z
            cmake --build ${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-reference \
            --parallel ${{env.NPROCS}}
          ccache -s
          du -hs ${{matrix.ccache_cache}}
      - name: Test Reference and Compare
        if: env.DO_REF_COMPARE == 'true'
        working-directory: ${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-reference
        run : |
          ctest ${{matrix.ctest_args}} -VV --output-on-failure

