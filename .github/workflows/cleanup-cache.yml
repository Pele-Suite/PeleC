name: CleanUpCache

on:
  workflow_run:
    workflows: [PeleC-CI]
    types:
      - completed

jobs:
  CleanUpCcacheCache:
    name: Clean Up Ccache Cache for ${{ github.event.workflow_run.name }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Clean up ccache
        run: |
          REPO=${{ github.repository }}

          # push or pull_request or schedule or ...
          EVENT=${{ github.event.workflow_run.event }}

          # Triggering workflow run name (e.g., PeleC-CI)
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"

          # For debugging, cat ${GITHUB_EVENT_PATH} to see the payload.

          if [[ $EVENT == "pull_request" ]]; then
            pr_head_sha=${{ github.event.workflow_run.head_sha }}
            pr_number=$(gh pr list --search $pr_head_sha --json number --jq '.[0].number')
            echo "Clean up cache for PR ${pr_number}"
            BRANCH=refs/pull/${pr_number}/merge
          else
            BRANCH=refs/heads/${{ github.event.workflow_run.head_branch }}
          fi

          # Setting this to not fail the workflow while deleting cache keys.
          set +e

          # In our cache keys, substring after `-git-` is git hash, substring
          # before that is a unique id for jobs (e.g., `ccache-PeleC-CI-CPU-GNUmake`).
          # The goal is to keep the newest key of each job and delete all others.

          # something like ccache-PeleC-CI-
          keyprefix="ccache-${WORKFLOW_NAME}-"

          cached_jobs=$(gh cache list -L 100 -R $REPO --ref $BRANCH --key "$keyprefix" --json key --jq '.[].key' | awk -F '-git-' '{print $1}' | sort | uniq)

          # cached_jobs is something like "ccache-PeleC-CI-CPU-CMake-ubuntu-24.04-2-Release ccache-PeleC-CI-CPU-GNUmake".
          # It might also contain spaces. Thus we set IFS to \n.
          IFS=$'\n'
          for j in $cached_jobs
          do
            # Delete all entries except the most recently created one. Not the
            # most recently used: PRs restore development's cache, so one that
            # restores the old key while this run's other jobs are still going
            # would otherwise make the old key win over the new one. Note that
            # `gh cache delete` has no ref filter, so we delete by cache id.
            old_ids=$(gh cache list -L 100 -R $REPO --ref $BRANCH --key "${j}-git-" --sort created_at --order desc --json id --jq '.[].id' | tail -n +2)
            for i in $old_ids
            do
              gh cache delete "$i" -R $REPO || true
            done
          done
          unset IFS
