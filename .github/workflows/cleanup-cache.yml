name: CleanUpCache

on:
  workflow_run:
    workflows: [PeleC-CI]
    types:
      - completed

jobs:
  CleanUpCcacheCache:
    name: Clean Up Ccache Cache for ${{ github.event.workflow_run.name }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # gh reads the repository from here, so no checkout is needed.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Clean up ccache
        # Event values go through the environment, not ${{ }} in the script:
        # a branch name is chosen by whoever pushed it (forks included), and
        # pasted into the script it could run shell commands.
        env:
          # push or pull_request or schedule or ...
          EVENT: ${{ github.event.workflow_run.event }}
          # Triggering workflow run name (e.g., PeleC-CI)
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |

          # For debugging, cat ${GITHUB_EVENT_PATH} to see the payload.

          if [[ $EVENT == "pull_request" ]]; then
            pr_number=$(gh pr list --search "${HEAD_SHA}" --json number --jq '.[0].number')
            echo "Clean up cache for PR ${pr_number}"
            BRANCH=refs/pull/${pr_number}/merge
          else
            BRANCH="refs/heads/${HEAD_BRANCH}"
          fi

          # Setting this to not fail the workflow while deleting cache keys.
          set +e

          # In our cache keys, the substring after `-git-` is the git hash, run
          # id and attempt (so a scheduled run on an unchanged commit, or a
          # re-run, can save); the substring before it is a unique id for jobs
          # (e.g., `ccache-PeleC-CI-CPU-GNUmake`).
          # The goal is to keep the newest key of each job and delete all others.

          # something like ccache-PeleC-CI-
          keyprefix="ccache-${WORKFLOW_NAME}-"

          cached_jobs=$(gh cache list -L 100 --ref $BRANCH --key "$keyprefix" --json key --jq '.[].key' | awk -F '-git-' '{print $1}' | sort | uniq)

          # cached_jobs is something like "ccache-PeleC-CI-CPU-CMake-ubuntu-24.04-2-Release ccache-PeleC-CI-CPU-GNUmake".
          # It might also contain spaces. Thus we set IFS to \n.
          IFS=$'\n'
          for j in $cached_jobs
          do
            # Delete all entries except the most recently created one. Not the
            # most recently used: PRs restore development's cache, so one that
            # restores the old key while this run's other jobs are still going
            # would otherwise make the old key win over the new one. Note that
            # `gh cache delete` has no ref filter, so we delete by cache id.
            old_ids=$(gh cache list -L 100 --ref $BRANCH --key "${j}-git-" --sort created_at --order desc --json id --jq '.[].id' | tail -n +2)
            for i in $old_ids
            do
              gh cache delete "$i" || true
            done
          done
          unset IFS
