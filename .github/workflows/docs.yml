name: PeleC-Docs

on:
  push:
    branches: [development]
    paths:
       - 'Docs/**'
       - 'README.rst'
       - '.github/workflows/docs.yml'
  pull_request:
    branches: [development]
    paths:
       - 'Docs/**'
       - 'README.rst'
       - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  Docs:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v6
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx_rtd_theme
      - name: Configure
        run: cmake -B${{runner.workspace}}/build-docs ${{github.workspace}}/Docs
      # Sphinx runs with -W --keep-going, so warnings fail the build.
      - name: Build
        working-directory: ${{runner.workspace}}/build-docs
        run: |
          echo "::add-matcher::${{github.workspace}}/.github/problem-matchers/sphinx.json"
          cmake --build .
      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/development' && !github.event.repository.fork
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{runner.workspace}}/build-docs/sphinx/html

  # GitHub Pages publishes the uploaded site directly (Settings > Pages >
  # Source: GitHub Actions), with no gh-pages branch or repo write token.
  Deploy:
    needs: Docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{steps.deploy.outputs.page_url}}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
